spring.application.name=soporte-tecnico-api
server.port=8080

# Conexión a PostgreSQL: base soporte_db, esquema soporte.
# Usuario y clave se pueden cambiar con las variables de entorno DB_USUARIO y DB_CLAVE.
spring.datasource.url=jdbc:postgresql://localhost:5432/soporte_db?currentSchema=soporte
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_CLAVE:postgres}

# Al arrancar se ejecutan los scripts 02 y 03: crean lo que falta y no borran datos
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:database/02_crear_esquema_y_tablas.sql
spring.sql.init.data-locations=file:database/03_datos_iniciales.sql
spring.sql.init.encoding=UTF-8

# JPA / Hibernate: las tablas las crean los scripts; Hibernate solo valida que
# coincidan con las entidades y avisa al arrancar si falta algo
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=soporte
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Swagger UI en http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
